name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pipenv
      - run: pipenv install
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pipenv
      - run: pipenv install
      - run: pipenv run test

  build:
    needs: [lint, test]

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - run: |
          docker build -t 353794848269.dkr.ecr.us-east-1.amazonaws.com/backend:${IMAGE_TAG} .
          docker push 353794848269.dkr.ecr.us-east-1.amazonaws.com/backend:${IMAGE_TAG}

  deploy:
    needs: build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/k8s

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - run: |
          aws eks update-kubeconfig --name cluster --region us-east-1

          kustomize edit set image backend=353794848269.dkr.ecr.us-east-1.amazonaws.com/backend:${IMAGE_TAG}

          kustomize build | kubectl apply -f -