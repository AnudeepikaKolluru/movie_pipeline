name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - run: npm ci
      - run: CI=true npm test

  build:
    needs: [lint, test]

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - run: |
          docker build \
          --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
          -t 353794848269.dkr.ecr.us-east-1.amazonaws.com/frontend:${IMAGE_TAG} .

          docker push 353794848269.dkr.ecr.us-east-1.amazonaws.com/frontend:${IMAGE_TAG}

  deploy:
    needs: build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/k8s

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - run: |
          aws eks update-kubeconfig --name cluster --region us-east-1

          kustomize edit set image frontend=353794848269.dkr.ecr.us-east-1.amazonaws.com/frontend:${IMAGE_TAG}

          kustomize build | kubectl apply -f -